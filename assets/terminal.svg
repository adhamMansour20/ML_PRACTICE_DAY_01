<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Terminal demo: running python app.py with 3 rooms and 100000 per room gives 800000">
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace; font-size: 19px; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="win"><rect x="20" y="20" width="960" height="320" rx="14"/></clipPath>
    <!-- typing reveals: 12s loop -->
    <clipPath id="t1"><rect x="72" y="88" height="30" width="0"><animate attributeName="width" values="0;0;150;150" keyTimes="0;0.042;0.133;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="426" y="128" height="30" width="0"><animate attributeName="width" values="0;0;14;14" keyTimes="0;0.25;0.267;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="312" y="168" height="30" width="0"><animate attributeName="width" values="0;0;70;70" keyTimes="0;0.358;0.408;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect x="20" y="20" width="960" height="320" fill="#0d1117"/>
    <rect x="20" y="20" width="960" height="46" fill="#161b22"/>
    <line x1="20" y1="66" x2="980" y2="66" stroke="#30363d"/>
  </g>
  <rect x="20.5" y="20.5" width="959" height="319" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="48" cy="43" r="6.5" fill="#ff5f57"/>
  <circle cx="70" cy="43" r="6.5" fill="#febc2e"/>
  <circle cx="92" cy="43" r="6.5" fill="#28c840"/>
  <text class="sans" x="500" y="48" text-anchor="middle" font-size="14" fill="#8b949e">~/ml_projects/day_01 — python</text>

  <!-- line 1: command (the "$" stays visible) -->
  <text class="mono" x="50" y="110" fill="#34d399" font-weight="700">$</text>

  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.917;0.958;1" dur="12s" repeatCount="indefinite"/>

    <g clip-path="url(#t1)">
      <text class="mono" x="72.8" y="110" fill="#e6edf3" textLength="148.2" lengthAdjust="spacingAndGlyphs">python app.py</text>
    </g>

    <!-- line 2 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.183;0.188;1" dur="12s" repeatCount="indefinite"/>
      <text class="mono" x="50" y="150" fill="#8b949e" textLength="364.8" lengthAdjust="spacingAndGlyphs">Enter Apartment Number Of Rooms:</text>
    </g>
    <g clip-path="url(#t2)">
      <text class="mono" x="426.2" y="150" fill="#fbbf24" font-weight="700" textLength="11.4" lengthAdjust="spacingAndGlyphs">3</text>
    </g>

    <!-- line 3 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.305;1" dur="12s" repeatCount="indefinite"/>
      <text class="mono" x="50" y="190" fill="#8b949e" textLength="250.8" lengthAdjust="spacingAndGlyphs">Enter Each Room Price:</text>
    </g>
    <g clip-path="url(#t3)">
      <text class="mono" x="312.2" y="190" fill="#fbbf24" font-weight="700" textLength="68.4" lengthAdjust="spacingAndGlyphs">100000</text>
    </g>

    <!-- line 4: result -->
    <rect x="38" y="214" width="450" height="40" rx="8" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.475;0.508;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.458;0.463;1" dur="12s" repeatCount="indefinite"/>
      <text class="mono" x="50" y="240" fill="#e6edf3" textLength="342" lengthAdjust="spacingAndGlyphs">The Apartment Money Amount is:</text>
      <text class="mono" x="403.4" y="240" fill="#34d399" font-weight="700" textLength="68.4" lengthAdjust="spacingAndGlyphs">800000</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.517;0.55;1" dur="12s" repeatCount="indefinite"/>
      <path d="M506 233 l7 7 l13 -14" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="sans" x="540" y="240" font-size="16" fill="#8b949e">500,000 + 3 × 100,000</text>
    </g>

    <!-- line 5: new prompt + cursor -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.555;1" dur="12s" repeatCount="indefinite"/>
      <text class="mono" x="50" y="292" fill="#34d399" font-weight="700">$</text>
      <rect class="cursor" x="73" y="275" width="11" height="22" fill="#e6edf3"/>
    </g>
  </g>
</svg>
