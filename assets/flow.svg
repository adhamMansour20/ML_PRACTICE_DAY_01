<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="How the prediction works: rooms times price per room plus base price equals price">
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace; }
    .hl { opacity: 0; animation: hl 4s ease-in-out infinite; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 1s; } .d3 { animation-delay: 2s; } .d4 { animation-delay: 3s; }
    @keyframes hl { 0% { opacity: 0; } 8%, 28% { opacity: 1; } 40%, 100% { opacity: 0; } }
    .dash { stroke-dasharray: 6 8; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
  </style>
  <defs>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="#0d1224" stroke="#ffffff" stroke-opacity="0.08"/>
  <text class="sans" x="600" y="52" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="4" fill="#94a3b8">HOW THE PREDICTION WORKS</text>

  <!-- connectors -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path class="dash" d="M283 175 H337"/>
    <path class="dash" d="M573 175 H627"/>
    <path class="dash" d="M863 175 H917"/>
  </g>
  <!-- operators -->
  <g class="mono" font-size="20" font-weight="700" text-anchor="middle">
    <circle cx="310" cy="175" r="17" fill="#0d1224" stroke="#a78bfa" stroke-width="2"/>
    <text x="310" y="182" fill="#c4b5fd">×</text>
    <circle cx="600" cy="175" r="17" fill="#0d1224" stroke="#22d3ee" stroke-width="2"/>
    <text x="600" y="182" fill="#67e8f9">+</text>
    <circle cx="890" cy="175" r="17" fill="#0d1224" stroke="#34d399" stroke-width="2"/>
    <text x="890" y="182" fill="#6ee7b7">=</text>
  </g>

  <!-- travelling dots -->
  <circle r="5" fill="#fbbf24" filter="url(#glow)" opacity="0">
    <animateMotion path="M283 175 H337" keyPoints="0;0;1;1" keyTimes="0;0.15;0.25;1" calcMode="linear" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.15;0.25;0.26;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#c4b5fd" filter="url(#glow)" opacity="0">
    <animateMotion path="M573 175 H627" keyPoints="0;0;1;1" keyTimes="0;0.4;0.5;1" calcMode="linear" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.4;0.5;0.51;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#67e8f9" filter="url(#glow)" opacity="0">
    <animateMotion path="M863 175 H917" keyPoints="0;0;1;1" keyTimes="0;0.65;0.75;1" calcMode="linear" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.65;0.75;0.76;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- card 1: feature -->
  <g>
    <rect x="55" y="90" width="220" height="170" rx="16" fill="url(#cardFill)" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect class="hl d1" x="55" y="90" width="220" height="170" rx="16" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
    <text class="sans" x="165" y="128" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#f59e0b">FEATURE</text>
    <text class="mono" x="165" y="180" text-anchor="middle" font-size="22" fill="#e2e8f0">rooms</text>
    <text class="sans" x="165" y="228" text-anchor="middle" font-size="28" font-weight="800" fill="#fbbf24">3</text>
  </g>
  <!-- card 2: weight -->
  <g>
    <rect x="345" y="90" width="220" height="170" rx="16" fill="url(#cardFill)" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect class="hl d2" x="345" y="90" width="220" height="170" rx="16" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
    <text class="sans" x="455" y="128" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#a78bfa">WEIGHT</text>
    <text class="mono" x="455" y="180" text-anchor="middle" font-size="20" fill="#e2e8f0">price_per_room</text>
    <text class="sans" x="455" y="228" text-anchor="middle" font-size="28" font-weight="800" fill="#c4b5fd">100,000</text>
  </g>
  <!-- card 3: bias -->
  <g>
    <rect x="635" y="90" width="220" height="170" rx="16" fill="url(#cardFill)" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect class="hl d3" x="635" y="90" width="220" height="170" rx="16" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
    <text class="sans" x="745" y="128" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#22d3ee">BIAS</text>
    <text class="mono" x="745" y="180" text-anchor="middle" font-size="22" fill="#e2e8f0">base_price</text>
    <text class="sans" x="745" y="228" text-anchor="middle" font-size="28" font-weight="800" fill="#67e8f9">500,000</text>
  </g>
  <!-- card 4: prediction -->
  <g>
    <rect x="925" y="90" width="220" height="170" rx="16" fill="url(#cardFill)" stroke="#34d399" stroke-opacity="0.35"/>
    <rect class="hl d4" x="925" y="90" width="220" height="170" rx="16" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
    <text class="sans" x="1035" y="128" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#34d399">PREDICTION</text>
    <text class="mono" x="1035" y="180" text-anchor="middle" font-size="22" fill="#e2e8f0">price</text>
    <text class="sans" x="1035" y="228" text-anchor="middle" font-size="28" font-weight="800" fill="#6ee7b7">800,000</text>
  </g>

  <text class="mono" x="600" y="295" text-anchor="middle" font-size="16" fill="#64748b">3 × 100,000 + 500,000 = 800,000</text>
</svg>
